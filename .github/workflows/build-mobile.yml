name: Build Mobile App

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build record ID from ERP'
        required: true
        type: string
      erp_url:
        description: 'ERP base URL (e.g. https://api.fixedplus.com.bd)'
        required: true
        type: string
      app:
        description: 'App to build'
        required: true
        default: 'storefront'
        type: choice
        options:
          - storefront
          - admin
          - pos
          - all
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - both

  repository_dispatch:
    types: [mobile-build]

env:
  BUILD_ID: ${{ github.event.client_payload.buildId || inputs.build_id || '' }}
  ERP_URL: ${{ github.event.client_payload.erpUrl || inputs.erp_url || '' }}
  CALLBACK_TOKEN: ${{ github.event.client_payload.callbackToken || secrets.MOBILE_BUILDER_CALLBACK_TOKEN || '' }}
  APP_INPUT: ${{ github.event.client_payload.app || inputs.app || 'storefront' }}
  PLATFORM: ${{ github.event.client_payload.platform || inputs.platform || 'android' }}

jobs:
  resolve-apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-apps.outputs.apps }}
    steps:
      - id: set-apps
        run: |
          case "${{ env.APP_INPUT }}" in
            all)    echo 'apps=["storefront","admin","pos"]' >> $GITHUB_OUTPUT ;;
            *)      echo 'apps=["${{ env.APP_INPUT }}"]' >> $GITHUB_OUTPUT ;;
          esac

  build:
    needs: resolve-apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.resolve-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (required by Capacitor 7 Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Fetch metadata from ERP (public endpoint)
        id: meta
        continue-on-error: true
        run: |
          if [ -z "$BUILD_ID" ] || [ -z "$ERP_URL" ]; then
            echo "ERROR: build_id and erp_url are required"
            exit 1
          fi
          META_URL="${ERP_URL}/api/mobile-builder/metadata/${BUILD_ID}"
          curl -sS -f -o metadata.json "$META_URL" || {
            echo "ERP metadata fetch failed — using inline fallback"
            echo '{"appName":"EcoMate","packageId":"com.ecomate.app","bundleId":"com.ecomate.app","versionName":"1.0.0","versionCode":1,"splashColor":"#0089CD"}' > metadata.json
          }
          echo "callback_url=${ERP_URL}/api/mobile-builder/artifact" >> $GITHUB_ENV
          echo "build_id=${BUILD_ID}" >> $GITHUB_ENV

      - name: Configure app
        run: bash scripts/configure-app.sh "${{ matrix.app }}" metadata.json

      - name: Build Android APK
        if: ${{ env.PLATFORM == 'android' || env.PLATFORM == 'both' }}
        run: bash scripts/build-android.sh "${{ matrix.app }}" release
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-apk
          path: mobile-builds/${{ matrix.app }}/android/latest.apk
          if-no-files-found: warn
